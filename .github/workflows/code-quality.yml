name: Code Quality

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - PR
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Require environment approval for PR analysis before using the SonarCloud token.
    # https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
    # The 'sonarcloud-analysis' environment should have required reviewers configured.
    environment: ${{ github.event_name == 'workflow_run' && 'sonarcloud-analysis' || '' }}
    # Skip for patchback PRs (automated backports of already-tested code)
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      !startsWith(github.event.workflow_run.head_branch || github.head_ref || '', 'patchback/backports/')
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout PR code
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # Shallow clones should be disabled for better SonarCloud analysis

      - name: Checkout branch
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # Shallow clones should be disabled for better SonarCloud analysis

      # PR and main push workflows already upload coverage for this commit.
      - name: Wait for coverage-producing tests
        if: github.event_name == 'push'
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          check-regexp: 'Test with Node.js 22'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Get coverage workflow run ID
        if: github.event_name == 'push'
        id: get-run-id
        run: |
          if [ "${{ github.event_name }}" = 'push' ]; then
            WORKFLOW_FILE=push.yml
            WORKFLOW_EVENT=push
          fi
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          RUNS_URL="/repos/${{ github.repository }}/actions/workflows/${WORKFLOW_FILE}/runs"
          QUERY="head_sha=${HEAD_SHA}&event=${WORKFLOW_EVENT}&per_page=1"
          RUN_ID=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "${RUNS_URL}?${QUERY}" \
            --jq '.workflow_runs[0].id')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = 'null' ]; then
            echo "No ${WORKFLOW_FILE} run found for this commit" >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Found coverage workflow run ID: $RUN_ID"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download coverage artifacts
        if: github.event_name == 'push'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            gh run download ${{ steps.get-run-id.outputs.run_id }} \
              --name coverage-report-22 \
              --dir ./coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PR coverage artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: coverage-report-22
          path: ./coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Run tests with coverage (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Manual dispatch has no companion PR or push workflow artifact.
          yarn install --frozen-lockfile
          yarn run test:all
          awk '/^SF:/{found=/^SF:(.*\/)?workspaces\/[^\/]+\/plugins\//} found' ./coverage/lcov.info > ./coverage/lcov-plugins.info
          test -s ./coverage/lcov-plugins.info

      - name: Verify coverage files
        run: |
          test -s ./coverage/lcov.info
          test -s ./coverage/lcov-plugins.info

      - name: Extract and export repo owner/name
        shell: bash
        run: |
          REPO_SLUG="${GITHUB_REPOSITORY}"
          IFS="/" read -r REPO_OWNER REPO_NAME <<< "$REPO_SLUG"
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: SonarCloud Scan (Pull Request)
        if: github.event_name == 'workflow_run'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.projectName='ansible-backstage-plugins'
            -Dsonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content/plugins,workspaces/portal-core/plugins,workspaces/portal-scaffolder/plugins
            -Dsonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content/plugins,workspaces/portal-core/plugins,workspaces/portal-scaffolder/plugins
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ github.event.workflow_run.pull_requests[0].number }}
            -Dsonar.pullrequest.branch=${{ github.event.workflow_run.head_branch }}
            -Dsonar.pullrequest.base=main
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud Scan (Branch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.projectName='ansible-backstage-plugins'
            -Dsonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content/plugins,workspaces/portal-core/plugins,workspaces/portal-scaffolder/plugins
            -Dsonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content/plugins,workspaces/portal-core/plugins,workspaces/portal-scaffolder/plugins
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true
