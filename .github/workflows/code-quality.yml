name: Code Quality

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_run:
    workflows:
      - PR
    types:
      - completed

# Deny the default GITHUB_TOKEN scope; jobs request what they need below.
permissions: {}

# workflow_run has no github.event.pull_request.number and github.ref is the
# default branch, so the old group collapsed every PR scan onto main.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && format('{0}-workflow_run-{1}', github.workflow, github.event.workflow_run.pull_requests[0].number || (github.event.workflow_run.head_branch && format('{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch)) || github.event.workflow_run.id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # Require environment approval for PR analysis before using the SonarCloud token.
    # https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
    # The 'sonarcloud-analysis' environment should have required reviewers configured.
    environment: ${{ github.event_name == 'workflow_run' && 'sonarcloud-analysis' || '' }}
    # Skip for patchback PRs (automated backports of already-tested code)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      !startsWith(github.event.workflow_run.head_branch, 'patchback/backports/'))
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      # Trusted base-repo checkout first; fork PR sources are fetched from
      # refs/pull/<n>/head after PR metadata is resolved.
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.event_name != 'workflow_run' && github.sha || '' }}
          fetch-depth: 0 # Shallow clones should be disabled for better SonarCloud analysis
          persist-credentials: false

      # PR and main push workflows already upload coverage for this commit.
      - name: Wait for coverage-producing tests
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        uses: lewagon/wait-on-check-action@ccfb013c15c8afb7bf2b7c028fb74dc5a068cccc # v1.3.4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          check-regexp: 'Test with Node.js 22'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10

      - name: Get coverage workflow run ID
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        id: get-run-id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = 'workflow_run' ]; then
            RUN_ID="${WORKFLOW_RUN_ID}"
          else
            RUNS_URL="/repos/${{ github.repository }}/actions/workflows/push.yml/runs"
            RUN_ID=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "${RUNS_URL}?head_sha=${HEAD_SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0].id')
          fi
          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = 'null' ]; then
            echo "No coverage workflow run found for this commit" >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "Found coverage workflow run ID: ${RUN_ID}"

      - name: Download coverage artifacts
        if: github.event_name == 'workflow_run' || github.event_name == 'push'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            gh run download ${{ steps.get-run-id.outputs.run_id }} \
              --name coverage-report-22 \
              --dir ./coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with coverage (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Manual dispatch has no companion PR or push workflow artifact.
          yarn install --frozen-lockfile
          yarn run test:all
          awk '/^SF:/{found=/^SF:(.*\/)?workspaces\/[^\/]+\/plugins\//} found' ./coverage/lcov.info > ./coverage/lcov-plugins.info
          test -s ./coverage/lcov-plugins.info

      - name: Verify coverage files
        run: |
          test -s ./coverage/lcov.info
          test -s ./coverage/lcov-plugins.info

      - name: Extract and export repo owner/name
        shell: bash
        run: |
          REPO_SLUG="${GITHUB_REPOSITORY}"
          IFS="/" read -r REPO_OWNER REPO_NAME <<< "$REPO_SLUG"
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: Resolve pull request metadata
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          REPO: ${{ github.repository }}
          # Trusted GitHub payload — not PR-controlled artifact content
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "::error::Invalid workflow_run head SHA"
            exit 1
          fi

          if [[ -z "${HEAD_BRANCH}" || -z "${HEAD_REPOSITORY}" ]]; then
            echo "::error::Missing workflow_run head_branch/head_repository"
            exit 1
          fi

          HEAD_OWNER="${HEAD_REPOSITORY%%/*}"

          # Fork branch names can include jq metacharacters. Bind them with --arg
          # instead of interpolating into the filter source.
          matching_pr_numbers() {
            jq -c --arg sha "${HEAD_SHA}" --arg branch "${HEAD_BRANCH}" --arg repo "${HEAD_REPOSITORY}" \
              '[.[] | select(.head.sha == $sha and .head.ref == $branch and .head.repo.full_name == $repo) | .number]'
          }

          pr_matches_run() {
            local number="$1"
            gh api "repos/${REPO}/pulls/${number}" \
              | jq -e --arg sha "${HEAD_SHA}" --arg branch "${HEAD_BRANCH}" --arg repo "${HEAD_REPOSITORY}" \
                '(.head.sha == $sha) and (.head.ref == $branch) and (.head.repo.full_name == $repo)' \
              >/dev/null
          }

          if [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]] && ! pr_matches_run "${PR_NUMBER}"; then
            PR_NUMBER=""
          fi

          # commits/{sha}/pulls can include other PRs that share the commit.
          # Accept a candidate only when exactly one PR matches this run.
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            MATCHING=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/commits/${HEAD_SHA}/pulls" \
              | matching_pr_numbers)
            MATCH_COUNT=$(jq 'length' <<< "${MATCHING}")
            if [[ "${MATCH_COUNT}" -eq 1 ]]; then
              PR_NUMBER=$(jq -r '.[0]' <<< "${MATCHING}")
            else
              PR_NUMBER=""
            fi
          fi

          # Fork PR head SHAs are often missing from the commits/{sha}/pulls API
          # and workflow_run.pull_requests. Resolve via trusted head owner:branch,
          # then require an exact head OID match (fail if 0 or >1).
          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            # -f selects POST unless the method is explicit, which would hit
            # create-PR instead of listing open PRs.
            MATCHES=$(gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/pulls" \
              -f state=open \
              -f "head=${HEAD_OWNER}:${HEAD_BRANCH}" \
              | matching_pr_numbers)
            MATCH_COUNT=$(jq 'length' <<< "${MATCHES}")
            if [[ "${MATCH_COUNT}" -ne 1 ]]; then
              echo "::error::Expected exactly one open PR for this workflow_run head, found ${MATCH_COUNT}"
              exit 1
            fi
            PR_NUMBER=$(jq -r '.[0]' <<< "${MATCHES}")
          fi

          if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Unable to resolve a trusted PR number for head SHA ${HEAD_SHA}"
            exit 1
          fi

          PR_DATA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          PR_BASE=$(jq -r '.base.ref' <<< "${PR_DATA}")
          PR_HEAD=$(jq -r '.head.ref' <<< "${PR_DATA}")

          if [[ -z "${PR_BASE}" || "${PR_BASE}" == "null" || -z "${PR_HEAD}" || "${PR_HEAD}" == "null" ]]; then
            echo "::error::Unable to resolve PR branch metadata for PR ${PR_NUMBER}"
            exit 1
          fi

          {
            echo "PR_NUMBER=${PR_NUMBER}"
            echo "PR_BASE=${PR_BASE}"
            echo "PR_HEAD=${PR_HEAD}"
          } >> "${GITHUB_ENV}"

          echo "Resolved PR #${PR_NUMBER} (${PR_HEAD} -> ${PR_BASE})"

      # Copy allowlisted settings from the trusted base checkout before replacing
      # the working tree with fork code. Scanner bootstrap keys (javaExePath, etc.)
      # are excluded so they cannot run with SONAR_TOKEN / GITHUB_TOKEN.
      - name: Stage trusted Sonar settings
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          TRUSTED_SETTINGS="${RUNNER_TEMP}/sonar-trusted.properties"
          : > "${TRUSTED_SETTINGS}"
          if [[ -f sonar-project.properties ]]; then
            grep -E '^(sonar\.(projectKey|organization|host\.url|projectName|sources|tests|test\.inclusions|test\.exclusions|exclusions|coverage\.exclusions|javascript\.lcov\.reportPaths|sourceEncoding|typescript\.tsconfigPath|qualitygate\.|cpd\.exclusions|issue\.ignore\.multicriteria))' \
              sonar-project.properties > "${TRUSTED_SETTINGS}" || true
          fi
          echo "SONAR_TRUSTED_SETTINGS=${TRUSTED_SETTINGS}" >> "${GITHUB_ENV}"

      - name: Checkout pull request revision
        if: github.event_name == 'workflow_run'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          git checkout --detach "${HEAD_SHA}"
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          rm -f sonar-project.properties .sonarcloud.properties sonar-project.json

      - name: SonarCloud Scan (Pull Request)
        if: github.event_name == 'workflow_run'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
        with:
          args: >
            -Dproject.settings=${{ env.SONAR_TRUSTED_SETTINGS }}
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.projectName='ansible-backstage-plugins'
            -Dsonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.sca.enabled=false
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }}
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.PR_HEAD }}
            -Dsonar.pullrequest.base=${{ env.PR_BASE }}
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud Scan (Branch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.projectName='ansible-backstage-plugins'
            -Dsonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true
