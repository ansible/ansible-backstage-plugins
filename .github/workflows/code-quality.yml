name: Code Quality

on:
  pull_request_target:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    # SECURITY: Require environment approval for pull_request_target to prevent pwn requests
    # https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
    # The 'sonarcloud-analysis' environment must be created in repo settings with required reviewers
    environment: ${{ github.event_name == 'pull_request_target' && 'sonarcloud-analysis' || '' }}
    # Skip for patchback PRs (automated backports of already-tested code)
    if: "!startsWith(github.event.pull_request.head.ref, 'patchback/backports/')"
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Shallow clones should be disabled for better SonarCloud analysis

      # Select the run that actually produced Node 22 coverage. Other jobs in
      # that run may still be running or have failed independently.
      - name: Wait for Node 22 coverage artifact
        if: github.event_name == 'pull_request_target' || github.event_name == 'push'
        id: get-run-id
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          COVERAGE_WAIT_SECONDS: 3600
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = 'push' ]; then
            WORKFLOW_FILE=push.yml
            WORKFLOW_EVENT=push
          else
            WORKFLOW_FILE=pr.yml
            WORKFLOW_EVENT=pull_request
          fi
          RUNS_URL="/repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW_FILE}/runs"
          QUERY="head_sha=${HEAD_SHA}&event=${WORKFLOW_EVENT}&per_page=100"
          DEADLINE=$((SECONDS + ${COVERAGE_WAIT_SECONDS:-3600}))
          echo "Waiting for Node 22 coverage for ${HEAD_SHA} (up to ${COVERAGE_WAIT_SECONDS:-3600}s)"
          while true; do
            RUN_IDS=$(gh api -H "Accept: application/vnd.github+json" "${RUNS_URL}?${QUERY}" |
              jq -r --arg sha "$HEAD_SHA" --arg event "$WORKFLOW_EVENT" \
                '.workflow_runs | map(select(.head_sha == $sha and .event == $event)) | sort_by(.id) | reverse | .[].id')
            for RUN_ID in $RUN_IDS; do
              JOBS=$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100")
              SUCCESS_COUNT=$(jq '[.jobs[] | select(.name == "Test with Node.js 22" and .status == "completed" and .conclusion == "success")] | length' <<< "$JOBS")
              if [ "$SUCCESS_COUNT" -eq 0 ]; then
                continue
              fi
              ARTIFACT_COUNT=$(gh api -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" |
                jq '[.artifacts[] | select(.name == "coverage-report-22" and .expired == false)] | length')
              if [ "$ARTIFACT_COUNT" -gt 0 ]; then
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
                echo "Found Node 22 coverage in workflow run $RUN_ID"
                exit 0
              fi
            done
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "Timed out waiting for Node 22 coverage for ${HEAD_SHA}" >&2
              exit 1
            fi
            sleep "${COVERAGE_POLL_INTERVAL_SECONDS:-30}"
          done

      - name: Download coverage artifacts
        if: github.event_name == 'pull_request_target' || github.event_name == 'push'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 10
          command: |
            gh run download ${{ steps.get-run-id.outputs.run_id }} \
              --name coverage-report-22 \
              --dir ./coverage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with coverage (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # Manual dispatch has no companion PR or push workflow artifact.
          yarn install --frozen-lockfile
          yarn run test:all
          awk '/^SF:/{found=/^SF:(.*\/)?workspaces\/[^\/]+\/plugins\//} found' ./coverage/lcov.info > ./coverage/lcov-plugins.info
          test -s ./coverage/lcov-plugins.info

      - name: Verify coverage files
        run: |
          test -s ./coverage/lcov.info
          test -s ./coverage/lcov-plugins.info

      - name: Extract and export repo owner/name
        shell: bash
        run: |
          REPO_SLUG="${GITHUB_REPOSITORY}"
          IFS="/" read -r REPO_OWNER REPO_NAME <<< "$REPO_SLUG"
          echo "REPO_OWNER=$REPO_OWNER" >> $GITHUB_ENV
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV

      - name: SonarCloud Scan (Pull Request)
        if: github.event_name == 'pull_request_target'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.projectName='ansible-backstage-plugins'
            -Dsonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }}
            -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud Scan (Branch)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets[format('{0}', vars.SONAR_TOKEN_SECRET_NAME)] }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ env.REPO_OWNER }}
            -Dsonar.projectKey=${{ env.REPO_OWNER }}_${{ env.REPO_NAME }}
            -Dsonar.projectName='ansible-backstage-plugins'
            -Dsonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/content-management/plugins,workspaces/portal-core/plugins,workspaces/content-development/plugins
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
            -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info
            -Dsonar.branch.name=${{ github.ref_name }}
            -Dsonar.qualitygate.wait=true
