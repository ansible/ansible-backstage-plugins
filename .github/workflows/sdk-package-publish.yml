name: Publish SDK preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Reviewed release version, for example 0.1.0-alpha.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-npm-preview
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'ansible/ansible-backstage-plugins' &&
      github.ref_type == 'branch' &&
      (github.ref == 'refs/heads/main' ||
      (startsWith(github.ref_name, 'release-') &&
      github.ref_name != 'release-' && !contains(github.ref_name, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    permissions:
      contents: read
      security-events: read
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      SDK_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Validate release branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main && ! "$GITHUB_REF" =~ ^refs/heads/release-[^/]+$ ]]; then
            echo 'Release requires main or a release-* branch without slashes.' >&2
            exit 1
          fi
      - name: Set artifact directory
        run: echo "SDK_VALIDATION_DIR=$RUNNER_TEMP/sdk-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '22.22.3'
      - name: Require reviewed release metadata
        run: node scripts/sdk-package-validation/release.mjs
      - uses: backstage/actions/yarn-install@b3c1841fd69e1658ac631afafd0fb140a2309024 # v0.6.17
      - name: Test release and archive guards
        run: node --test scripts/sdk-package-validation/*.test.mjs
      - name: Run repository tests
        run: yarn test --watch=false
      - name: Build, pack and validate release archives
        run: yarn validate:sdk-packages
      - name: Install pinned SBOM generator
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.57.1
      - name: Generate release SBOMs
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: node scripts/sdk-package-validation/sbom.mjs
      - name: Gate release on exact-commit SAST and consumer dependency SCA
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sdk-package-validation/security.mjs
      - name: Retain security diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-security-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-release/security/scan-status.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Verify complete release set
        run: node scripts/sdk-package-validation/publish.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: handoff
        with:
          name: sdk-npm-preview-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdk-release/artifacts
            ${{ runner.temp }}/sdk-release/sboms
            ${{ runner.temp }}/sdk-release/report.json
            ${{ runner.temp }}/sdk-release/security
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-preview
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      SDK_RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Isolate publication configuration
        run: |
          {
            echo "SDK_VALIDATION_DIR=$RUNNER_TEMP/sdk-release"
            echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npm-user.npmrc"
            echo "NPM_CONFIG_GLOBALCONFIG=$RUNNER_TEMP/npm-global.npmrc"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: '22.22.3'
      - name: Install OIDC-capable npm without lifecycle scripts
        working-directory: ${{ runner.temp }}
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          : > "$NPM_CONFIG_GLOBALCONFIG"
          npm install --global --prefix "$RUNNER_TEMP/npm-cli" npm@11.6.4 --ignore-scripts --registry=https://registry.npmjs.org/
          echo "$RUNNER_TEMP/npm-cli/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/sdk-release
      - name: Revalidate approved archive bytes and release metadata
        run: node scripts/sdk-package-validation/publish.mjs
      - name: Sign archive, SBOM and report provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/sdk-release/artifacts/*.tgz
            ${{ runner.temp }}/sdk-release/sboms/*.json
            ${{ runner.temp }}/sdk-release/report.json
            ${{ runner.temp }}/sdk-release/security/**
          create-storage-record: false
      - name: Retain signed release evidence
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$SDK_VALIDATION_DIR/provenance.sigstore.json"
      - name: Upload signed release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-npm-preview-signed-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sdk-release/artifacts
            ${{ runner.temp }}/sdk-release/sboms
            ${{ runner.temp }}/sdk-release/report.json
            ${{ runner.temp }}/sdk-release/provenance.sigstore.json
            ${{ runner.temp }}/sdk-release/security
          if-no-files-found: error
          retention-days: 30
      - name: Publish exact archives through npm OIDC
        working-directory: ${{ runner.temp }}
        run: node "$GITHUB_WORKSPACE/scripts/sdk-package-validation/publish.mjs" --publish
