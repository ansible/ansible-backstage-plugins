---
name: test
on:
  pull_request:
    branches:
      - main
      - devel

concurrency:
  group: ${{ github.workflow }}-${ github.event_name }-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install pre-commit
    # No yarn install in this job. Skip pre-commit hooks that invoke yarn
    # pr.yml runs them after dependencies are installed 
    # (eslint via yarn lint:all, openapi-lint, openapi-drift).
    - run: SKIP=eslint,openapi-lint,openapi-drift pre-commit run --all-files
