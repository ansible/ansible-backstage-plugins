# Required metadata
sonar.projectKey=ansible_ansible-backstage-plugins
sonar.organization=ansible
sonar.host.url=https://sonarcloud.io
sonar.token=${SONAR_TOKEN}
sonar.projectName=ansible-backstage-plugins

# Source and test directories
sonar.sources=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/portal-core/plugins,workspaces/self-service/plugins
sonar.tests=workspaces/aap/plugins,workspaces/apme/plugins,workspaces/portal-core/plugins,workspaces/self-service/plugins
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/.eslintrc.js,**/node_modules/**,**/dist/**,**/dist-dynamic/**,**/coverage/**
sonar.coverage.exclusions=**/setupTests.ts,**/setupTests.js

# Coverage report paths
# Use plugin-only workspace coverage in CI, excluding app/backend packages.
# Falls back to lcov.info for local runs
sonar.javascript.lcov.reportPaths=./coverage/lcov-plugins.info,./coverage/lcov.info

# Source file encoding
sonar.sourceEncoding=UTF-8

# TypeScript specific settings
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate - wait for quality gate results
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplicate code detection
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/providers/AAPEntityProvider.ts,**/providers/AAPJobTemplateProvider.ts

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,ordered1,ordered2,ordered3,ordered4,ordered5,ordered6,ordered7,ordered8,ordered9,ordered10,ordered11

# S6544 - unsafe member access in tests
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6544
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6544
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.tsx

# S5906 - unsafe member access in tests
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S5906
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.test.ts
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S5906
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.test.tsx

# S2068 - hard-coded password false positives in test mocks
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e5.resourceKey=**/tests/**

# S1874 - deprecated API usage (Backstage upstream deprecations)
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.ts
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*.tsx

# S1444 - public static mutable (Backstage plugin pattern convention)
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S1444
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*.ts

# S2486 - empty catch blocks (intentional error suppression in auth/logout)
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S2486
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*.ts

# S3776 - cognitive complexity (requires major refactoring, tracked as tech debt)
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*.ts

# S107 - too many parameters (requires signature refactoring)
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*.ts

# S2004 - nested functions too deep (intentional in pagination batch processing)
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*.ts

# Deliberately sequential polling, retry/backoff, dependent pagination, and throttled batches.
# Keep this exception file-scoped: unbounded Promise.all would change behavior or load.
sonar.issue.ignore.multicriteria.ordered1.ruleKey=typescript:S9382
sonar.issue.ignore.multicriteria.ordered1.resourceKey=workspaces/aap/plugins/auth-backend-module-rhaap-provider/src/resolvers.ts
sonar.issue.ignore.multicriteria.ordered2.ruleKey=typescript:S9382
