openapi: 3.1.0
info:
  title: ansible-automation-portal
  version: '1'
  description: |
    API for the Ansible Automation Portal backend plugin in Red Hat Developer Hub / Backstage.
    Provides endpoints for syncing AAP resources into the Backstage catalog, managing execution
    environments, and proxying Git SCM operations.
  license:
    name: Apache-2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  contact: {}

servers:
  - url: /

tags:
  - name: Health
    description: Health check endpoints
  - name: AAP Sync
    description: Ansible Automation Platform synchronization and user management
  - name: Ansible Content Sync
    description: Sync Ansible content from PAH and SCM sources (superuser required)
  - name: Execution Environments
    description: Execution environment registration and build
  - name: Git Content
    description: Fetch file content and CI activity from GitHub/GitLab
  - name: Portal Health
    description: Portal plugin health aggregation (portal-health-backend)
  - name: Portal Operations
    description: Authenticated dispatch of registered Portal operations
  - name: APME
    description: Automation Platform Management Experience — quality scanning, settings, AI config, projects, suppressions
  - name: Automation Content Registries
    description: Configured OCI registries and their discovered capabilities (automation-content-backend)
  - name: Automation Content
    description: Type-agnostic access to every content artifact over OCI registries (automation-content-backend)
  - name: Automation Content Execution Environments
    description: Aliases over /content for execution environments
  - name: Automation Content Collections
    description: Ansible collection artifacts
  - name: Automation Content Items
    description: Modules, plugins, roles and EDA plugins — documentation and agent grounding. Scope with `in` to a specific artifact
  - name: Automation Content Resolution
    description: Match requirements against available content
  - name: Automation Content Configuration
    description: Declarative configuration export and validation

components:
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
      additionalProperties: false

    AAPSyncResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - sync_started
            - already_syncing
            - failed
          description: Result of the sync trigger request
        error:
          type: string
          description: Error message when status is failed
      additionalProperties: false

    AAPProviderSyncStatus:
      type: object
      required:
        - lastSync
        - syncInProgress
        - lastFailedSyncTime
        - lastSyncStatus
        - lastDuplicateEntityCount
        - lastMissingOrganizations
      properties:
        lastSync:
          type:
            - string
            - 'null'
          description: ISO timestamp of the last successful sync
        syncInProgress:
          type: boolean
          description: Whether a sync is currently running
        lastFailedSyncTime:
          type:
            - string
            - 'null'
          description: ISO timestamp of the last failed sync
        lastSyncStatus:
          type:
            - string
            - 'null'
          enum:
            - success
            - failure
            - null
          description: Status of the last sync attempt
        lastDuplicateEntityCount:
          type: integer
          minimum: 0
          description: Duplicate catalog keys skipped during the last successful sync
        lastMissingOrganizations:
          type: array
          items:
            type: string
          description: Configured organizations absent from AAP during the last successful sync
      additionalProperties: false

    SyncResultStatus:
      type: string
      enum:
        - sync_started
        - already_syncing
        - failed
        - invalid
      description: Status of an individual sync operation

    SyncResponseSummary:
      type: object
      required:
        - total
        - sync_started
        - already_syncing
        - failed
        - invalid
      properties:
        total:
          type: integer
        sync_started:
          type: integer
        already_syncing:
          type: integer
        failed:
          type: integer
        invalid:
          type: integer
      additionalProperties: false

    SyncError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
      additionalProperties: false

    SyncFilter:
      type: object
      description: |
        Hierarchical filter for SCM content sync.
        - scmProvider alone syncs all hosts and orgs for that provider
        - hostName requires scmProvider
        - organization requires both scmProvider and hostName
      properties:
        scmProvider:
          type: string
          enum:
            - github
            - gitlab
        hostName:
          type: string
          description: SCM host (e.g. github.com, my-gitlab.example.com)
        organization:
          type: string
          description: Organization or group name
      additionalProperties: false

    SCMSyncResult:
      type: object
      required:
        - scmProvider
        - hostName
        - organization
        - status
      properties:
        scmProvider:
          type: string
        hostName:
          type: string
        organization:
          type: string
        providerName:
          type: string
        status:
          $ref: '#/components/schemas/SyncResultStatus'
        error:
          $ref: '#/components/schemas/SyncError'
      additionalProperties: false

    PAHSyncResult:
      type: object
      required:
        - repositoryName
        - status
      properties:
        repositoryName:
          type: string
        providerName:
          type: string
        status:
          $ref: '#/components/schemas/SyncResultStatus'
        error:
          $ref: '#/components/schemas/SyncError'
      additionalProperties: false

    PAHSyncFilter:
      type: object
      required:
        - repository_name
      properties:
        repository_name:
          type: string
          description: PAH repository name (e.g. rh-certified, validated)
      additionalProperties: false

    ProviderStatus:
      type: object
      required:
        - sourceId
        - providerName
        - enabled
        - syncInProgress
        - lastSyncTime
        - lastFailedSyncTime
        - lastSyncStatus
        - collectionsFound
        - collectionsDelta
      properties:
        sourceId:
          type: string
        repository:
          type: string
          description: PAH repository name (present for PAH providers)
        scmProvider:
          type: string
          description: SCM provider type (present for SCM providers)
        hostName:
          type: string
          description: SCM host name (present for SCM providers)
        organization:
          type: string
          description: SCM organization (present for SCM providers)
        providerName:
          type: string
        enabled:
          type: boolean
        syncInProgress:
          type: boolean
        lastSyncTime:
          type:
            - string
            - 'null'
        lastFailedSyncTime:
          type:
            - string
            - 'null'
        lastSyncStatus:
          type:
            - string
            - 'null'
          enum:
            - success
            - failure
            - null
        collectionsFound:
          type: integer
        collectionsDelta:
          type: integer
      additionalProperties: false

    # ---- Automation content (automation-content-backend) ----

    ContentErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Stable machine-readable code, for agents branching on failure
      additionalProperties: false

    RegistryCapabilities:
      type: object
      description: |
        What a registry was observed to support. Discovered by probing, never assumed:
        the platform must work against any OCI-compliant registry without relying on
        vendor-specific extensions, so features gate on this and degrade rather than
        fail.
      required: [referrers, catalogEnumeration, delete, notifications, auth]
      properties:
        referrers:
          type: string
          enum: [native, tag-fallback, none]
          description: |
            How artifacts referring to an image are discovered. `native` is the OCI 1.1
            referrers endpoint; `tag-fallback` is the `sha256-<hex>` tag convention used
            by registries that predate it.
        catalogEnumeration:
          type: boolean
          description: Whether the registry lists its own repositories. Many hosted registries disable this, in which case repositories must be configured explicitly.
        tagPagination:
          type: boolean
        delete:
          type: string
          enum: [manifest, tag, none, unknown]
          description: |
            Deletion support. Never probed, because probing would be destructive —
            `unknown` until declared in configuration, and delete affordances stay
            hidden while unknown.
        notifications:
          type: string
          enum: [webhook, poll-only]
          description: Whether the registry can push change events. `poll-only` means drift is detected by digest comparison.
        auth:
          type: array
          items:
            type: string
            enum: [anonymous, basic, bearer, oauth2]
        notes:
          type: array
          items: { type: string }
          description: Human-readable observations from probing, including why a capability was not determined.

    ContentRegistry:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
        namespaces:
          type: array
          items: { type: string }
        repositories:
          type: array
          items: { type: string }
        capabilities:
          $ref: '#/components/schemas/RegistryCapabilities'

    Enumeration:
      type: object
      description: Provenance of a content inventory. Determines how much it can be trusted.
      required: [status, source]
      properties:
        status:
          type: string
          enum: [complete, partial, unknown]
        source:
          type: string
          enum: [build-time-manifest, labels, blob-fetch, external-introspection]
          description: |
            `build-time-manifest` is exact: generated inside the image by its own
            ansible-core. Everything else is an approximation whose fidelity decays as
            the extracting core diverges from the image's.
        ansibleCore:
          type: string
          description: The ansible-core that performed extraction. Absent implies reduced fidelity.
        extractedAt:
          type: string
          format: date-time

    ContentCounts:
      type: object
      properties:
        collections: { type: integer }
        plugins: { type: integer }
        pluginsByType:
          type: object
          additionalProperties: { type: integer }
        roles: { type: integer }
        playbooks: { type: integer }
        edaPlugins: { type: integer }
        rulebooks: { type: integer }

    Classification:
      type: object
      description: |
        Why an image was, or was not, recognised as a given content type. Recorded so an
        operator never has to guess why something is missing from a listing.
      required: [type, confidence, signals]
      properties:
        type:
          type: string
          description: '`execution-environment`, or `oci-image` when unrecognised.'
        confidence:
          type: string
          enum: [certain, likely, no]
        signals:
          type: array
          items: { type: string }
          description: |
            The signals that fired, in the order checked: a content-manifest referrer,
            the `ansible-execution-environment` label that ansible-builder emits on
            every EE it builds, or our own manifest label.

    ExecutionEnvironment:
      type: object
      required: [ref, type, registry, repository, digest, contentsKnown]
      properties:
        type:
          type: string
          description: Result of classification. Only `execution-environment` has enumerable contents.
        classification:
          $ref: '#/components/schemas/Classification'
        ref:
          type: string
          description: Stable opaque identifier for this artifact.
          examples: ['local-registry/demo/network-ee@sha256:05abb921']
        registry: { type: string }
        repository: { type: string }
        digest:
          type: string
          description: Immutable content address. Governance and identity key on this, never on a tag.
        tags:
          type: array
          items: { type: string }
          description: Mutable pointers currently resolving to this digest. Display only.
        pullReference:
          type: string
          description: |
            A reference a container runtime can pull directly. The portal is never in
            the artifact data path; clients pull from the registry.
        contentsKnown:
          type: boolean
          description: False when no content manifest is published. Distinct from containing nothing.
        enumeration:
          $ref: '#/components/schemas/Enumeration'
        counts:
          $ref: '#/components/schemas/ContentCounts'
        collections:
          type: array
          items: { $ref: '#/components/schemas/CollectionRef' }

    CollectionRef:
      type: object
      required: [namespace, name, version]
      properties:
        namespace: { type: string }
        name: { type: string }
        version: { type: string }
        fqcn:
          type: string
          examples: ['cisco.ios']

    Collection:
      allOf:
        - $ref: '#/components/schemas/CollectionRef'
        - type: object
          properties:
            description: { type: string }
            repository: { type: string }
            counts: { $ref: '#/components/schemas/ContentCounts' }
            providedBy:
              type: array
              description: Execution environments shipping this collection version.
              items: { type: string }

    OptionSpec:
      type: object
      description: An argument specification. Recursive — network resource modules nest several levels deep, and that nesting is the detail agents need.
      properties:
        type: { type: string }
        elements: { type: string }
        required: { type: boolean }
        default: {}
        choices:
          type: array
          items: {}
        aliases:
          type: array
          items: { type: string }
        versionAdded: { type: string }
        description:
          type: array
          items: { type: string }
        suboptions:
          type: object
          additionalProperties: { $ref: '#/components/schemas/OptionSpec' }

    ContentItemSummary:
      type: object
      description: A content item inside an artifact — a module, plugin, role or EDA plugin.
      required: [fqcn, name, type]
      properties:
        fqcn:
          type: string
          examples: ['cisco.ios.ios_vlans']
        name: { type: string }
        type:
          type: string
          description: 'Plugin type: module, filter, lookup, test, connection, cliconf, netconf, event_source, event_filter, role, playbook, …'
        collection: { type: string }
        collectionVersion: { type: string }
        shortDescription: { type: string }
        versionAdded: { type: string }
        deprecated: { type: boolean }

    ContentItem:
      allOf:
        - $ref: '#/components/schemas/ContentItemSummary'
        - type: object
          properties:
            description:
              type: array
              items: { type: string }
            author:
              type: array
              items: { type: string }
            notes:
              type: array
              items: { type: string }
            options:
              type: object
              additionalProperties: { $ref: '#/components/schemas/OptionSpec' }
            examples: { type: string }
            returns:
              type: object
              additionalProperties: true
            providedBy:
              type: array
              description: Execution environments in which this item is available.
              items: { type: string }
            enumeration:
              $ref: '#/components/schemas/Enumeration'

    RequirementsResolution:
      type: object
      description: Which execution environments satisfy a set of collection requirements.
      properties:
        satisfiedBy:
          type: array
          items:
            type: object
            properties:
              ref: { type: string }
              pullReference: { type: string }
              matched:
                type: array
                items: { $ref: '#/components/schemas/CollectionRef' }
        unsatisfied:
          type: array
          description: Requirements no available environment provides.
          items:
            type: object
            properties:
              name: { type: string }
              version: { type: string }
              reason: { type: string }
        notes:
          type: array
          items: { type: string }

    ContentConfig:
      type: object
      description: |
        Declarative content configuration. Round-trips: what `/config/export` emits can
        be committed to Git and fed back to `/config/validate`.
      required: [apiVersion, kind, registries]
      properties:
        apiVersion:
          type: string
          examples: ['content.ansible.com/v1']
        kind:
          type: string
          examples: ['ContentConfiguration']
        registries:
          type: array
          items: { $ref: '#/components/schemas/ContentRegistry' }

    ValidationResult:
      type: object
      required: [valid, errors, warnings]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
        warnings:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }


paths:
  /context:
    servers:
      - url: /api/portal-operations
    get:
      operationId: getPortalContext
      summary: Get authenticated Portal identity and configured organization memberships
      description: Returns server-resolved memberships for the authenticated user without deriving organization from catalog namespace or accepting client-supplied organization claims.
      tags: [Portal Operations]
      security:
        - JWT: []
      responses:
        '200':
          description: Trusted memberships; a single organizationId is present only when unambiguous
          content:
            application/json:
              schema:
                type: object
                required: [userEntityRef, userId]
                properties:
                  userEntityRef:
                    type: string
                  userId:
                    type: string
                  organizationId:
                    type: string
                  organizationIds:
                    type: array
                    items:
                      type: string
        '401':
          description: User authentication required
        '403':
          description: No authorized configured organization membership
  /entitlements/{entitlementId}:
    servers:
      - url: /api/portal-operations
    get:
      operationId: checkPortalEntitlement
      summary: Check host-owned capability availability
      description: |
        Requires authenticated user credentials and read access to the catalog subject.
        The host resolves trusted configured memberships, checks whether any has an availability
        grant, and evaluates the registered Backstage permission. Repositories do not acquire AAP ownership. Unknown entitlements,
        missing organization context or grants, and authorization failures deny access.
        Clients cannot supply organization IDs, grants, permission names, or scopes.
        This read-only check does not authorize a subsequent mutation.
      tags:
        - Portal Operations
      security:
        - JWT: []
      parameters:
        - name: entitlementId
          in: path
          required: true
          description: Backend-registered entitlement ID, for example apme.scanning
          schema:
            type: string
        - name: entityRef
          in: query
          required: true
          description: Catalog subject whose read access is checked using caller credentials
          schema:
            type: string
      responses:
        '200':
          description: Availability and permission decision for the caller's authorized memberships
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [allowed]
                properties:
                  allowed:
                    type: boolean
                  organizationId:
                    type: string
                  organizationIds:
                    type: array
                    items:
                      type: string
                  scope:
                    type: string
                    enum: [global, organization]
        '400':
          description: Invalid entity reference or unsupported query fields
        '401':
          description: User authentication required
        '403':
          description: Catalog subject not accessible
        '500':
          description: Catalog authorization service unavailable
  /{operationId}:
    servers:
      - url: /api/portal-operations
    post:
      operationId: executePortalOperation
      summary: Execute a registered Portal operation
      description: |
        Dispatches an operation exposed for REST after checking its declared permission
        and input schema, with server-side entitlement enforcement. Shared-resource operations
        use granted caller memberships without assigning an AAP owner to the resource.
        Organization-scoped operations require an authorized selected organization.
        The handler resolves the catalog subject and applies resource checks.
        Plugin URLs and project IDs are not subjects.
        An accepted long-running operation can return a scan or job reference; HTTP 200
        does not mean the job has completed. Unregistered operations return HTTP 404.
      tags:
        - Portal Operations
      security:
        - JWT: []
      parameters:
        - name: operationId
          in: path
          required: true
          description: Registered operation ID, for example apme.quality.scan
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject:
                  type: object
                  additionalProperties: false
                  required: [entityRef]
                  properties:
                    entityRef:
                      type: string
                      description: Catalog entity reference resolved by the operation handler
                input:
                  type: object
                  description: Additional input validated against the registered operation schema
      responses:
        '200':
          description: Operation handler result, potentially a pending job reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: {}
        '400':
          description: Invalid subject or operation input
        '401':
          description: User authentication required
        '403':
          description: Operation or repository access denied
        '404':
          description: Operation or subject unavailable
        '413':
          description: Request exceeds the 64 KiB payload limit
        '500':
          description: Handler or output validation failure
  /health:
    get:
      operationId: getHealth
      summary: Health check
      description: Returns the health status of the plugin backend.
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                additionalProperties: false

  /ansible/sync/from-aap/orgs_users_teams:
    post:
      operationId: syncOrgsUsersTeams
      summary: Trigger AAP organizations, users, and teams sync
      description: |
        Triggers a background synchronization of organizations, users, and teams from Ansible Automation Platform into the Backstage catalog.
        The endpoint returns immediately — the sync runs asynchronously via the scheduler.
        **Permissions**: Requires superuser access (`aap.platform/is_superuser` annotation) or an allowed external-access service principal.
      tags:
        - AAP Sync
      security:
        - JWT: []
      responses:
        '200':
          description: Sync already in progress (request skipped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AAPSyncResponse'
        '202':
          description: Sync triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AAPSyncResponse'
        '403':
          description: Forbidden - superuser access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Provider not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AAPSyncResponse'

  /ansible/sync/from-aap/job_templates:
    post:
      operationId: syncJobTemplates
      summary: Trigger AAP job templates sync
      description: |
        Triggers a background synchronization of job templates from Ansible Automation Platform into the Backstage catalog.
        The endpoint returns immediately — the sync runs asynchronously via the scheduler.
        **Permissions**: Requires superuser access (`aap.platform/is_superuser` annotation) or an allowed external-access service principal.
      tags:
        - AAP Sync
      security:
        - JWT: []
      responses:
        '200':
          description: Sync already in progress (request skipped)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AAPSyncResponse'
        '202':
          description: Sync triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AAPSyncResponse'
        '403':
          description: Forbidden - superuser access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Provider not initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AAPSyncResponse'

  /ansible/sync/status:
    get:
      operationId: getSyncStatus
      summary: Get sync status across all providers
      description: |
        Returns the current synchronization status for AAP entities and/or Ansible content providers.
        If neither query parameter is provided, both sections are returned.
        **Permissions**: Requires the Backstage catalog **entity read** permission (`catalog.entity.read`), evaluated via the permission framework.
      tags:
        - Ansible Content Sync
      security:
        - JWT: []
      parameters:
        - name: aap_entities
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
          description: Include AAP sync status (orgs/users/teams and job templates)
        - name: ansible_contents
          in: query
          required: false
          schema:
            type: string
            enum:
              - 'true'
          description: Include Ansible content sync status (PAH collections and SCM git contents)
      responses:
        '200':
          description: Sync status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  aap:
                    type: object
                    properties:
                      orgsUsersTeams:
                        $ref: '#/components/schemas/AAPProviderSyncStatus'
                      jobTemplates:
                        $ref: '#/components/schemas/AAPProviderSyncStatus'
                    additionalProperties: false
                  content:
                    type: object
                    required:
                      - syncInProgress
                      - providers
                    properties:
                      syncInProgress:
                        type: boolean
                      providers:
                        type: array
                        items:
                          $ref: '#/components/schemas/ProviderStatus'
                    additionalProperties: false
                additionalProperties: false
        '403':
          description: Forbidden - caller lacks catalog entity read permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error retrieving sync status
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                  - aap
                  - content
                properties:
                  error:
                    type: string
                  aap:
                    type: object
                    required:
                      - orgsUsersTeams
                      - jobTemplates
                    properties:
                      orgsUsersTeams:
                        type: 'null'
                      jobTemplates:
                        type: 'null'
                    additionalProperties: false
                  content:
                    type: 'null'
                additionalProperties: false

  /ansible/sync/from-aap/content:
    post:
      operationId: syncFromAapContent
      summary: Trigger PAH collections sync
      description: |
        Starts synchronization of Private Automation Hub collections.
        If no filters are provided, all configured PAH repositories are synced.
        **Permissions**: Requires superuser access (`aap.platform/is_superuser` annotation) or an allowed external-access service principal.
      tags:
        - Ansible Content Sync
      security:
        - JWT: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/PAHSyncFilter'
                  description: List of PAH repositories to sync. Empty or omitted syncs all.
              additionalProperties: false
      responses:
        '200':
          description: All repositories already syncing
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PAHSyncResult'
                additionalProperties: false
        '202':
          description: All syncs started successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PAHSyncResult'
                additionalProperties: false
        '207':
          description: Mixed results (some started, some skipped/failed/invalid)
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PAHSyncResult'
                additionalProperties: false
        '400':
          description: All repositories invalid or no providers configured
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PAHSyncResult'
                additionalProperties: false
        '403':
          description: Forbidden - superuser access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: All syncs failed
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/PAHSyncResult'
                additionalProperties: false

  /ansible/sync/from-scm/content:
    post:
      operationId: syncFromScmContent
      summary: Trigger SCM git contents sync
      description: |
        Starts synchronization of Ansible content from Git repositories (GitHub/GitLab).
        Supports hierarchical filtering: scmProvider -> hostName -> organization.
        If no filters are provided, all configured SCM sources are synced.
        **Permissions**: Requires superuser access (`aap.platform/is_superuser` annotation) or an allowed external-access service principal.
      tags:
        - Ansible Content Sync
      security:
        - JWT: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters:
                  type: array
                  items:
                    $ref: '#/components/schemas/SyncFilter'
                  description: |
                    Hierarchical filters for selecting which SCM sources to sync.
                    Empty or omitted syncs all sources.
              additionalProperties: false
      responses:
        '200':
          description: All providers already syncing
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SCMSyncResult'
                additionalProperties: false
        '202':
          description: All syncs started successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SCMSyncResult'
                additionalProperties: false
        '207':
          description: Mixed results (some started, some skipped/failed/invalid)
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SCMSyncResult'
                additionalProperties: false
        '400':
          description: All filters invalid or no providers configured
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SCMSyncResult'
                additionalProperties: false
        '403':
          description: Forbidden - superuser access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: All syncs failed
          content:
            application/json:
              schema:
                type: object
                required:
                  - summary
                  - results
                properties:
                  summary:
                    $ref: '#/components/schemas/SyncResponseSummary'
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SCMSyncResult'
                additionalProperties: false

  /ansible/ee:
    post:
      operationId: registerExecutionEnvironment
      summary: Register an execution environment
      description: |
        Registers a new execution environment entity in the catalog.
        This endpoint is restricted to backend service-to-service calls only
        (e.g. from the scaffolder plugin). User requests are rejected.
        **Permissions**: Service-to-service only (service principal required, user principals rejected).
      tags:
        - Execution Environments
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entity
              properties:
                entity:
                  type: object
                  description: Backstage catalog entity representing the execution environment
              additionalProperties: false
      responses:
        '200':
          description: Execution environment registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                additionalProperties: false
        '400':
          description: Missing entity in request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error registering execution environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ansible/ee/{name}:
    delete:
      operationId: unregisterExecutionEnvironment
      summary: Unregister an existing execution environment
      description: |
        Unregisters an existing execution environment entity from the catalog.
        Used by the scaffolder before recreating an EE with the same name.
        **Permissions**: Requires `catalog.entity.delete` for the caller
        (user or service principal).
      tags:
        - Execution Environments
      security:
        - JWT: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
            pattern: '^[a-z0-9]([a-z0-9._-]{0,61}[a-z0-9])?$'
          description: Execution environment entity metadata.name (lowercase slug)
      responses:
        '200':
          description: Execution environment unregistered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - mode
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  mode:
                    type: string
                    enum:
                      - location
                      - provider
                      - entity
                      - entity-transient
                  warning:
                    type: string
                    description: >-
                      Present when the removal is not durable (e.g. shared
                      location may re-ingest the entity on refresh).
                additionalProperties: false
        '204':
          description: No existing entity to clean up
        '400':
          description: Invalid name or entity is not an execution-environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller lacks catalog.entity.delete permission for the entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Shared catalog location has colocated entities and target has no uid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error unregistering execution environment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ansible/git/file-content:
    get:
      operationId: getGitFileContent
      summary: Fetch file content from a Git repository
      description: |
        Retrieves the content of a file from a GitHub or GitLab repository.
        The response content type is determined by the file extension.
        **Permissions**: Requires at least one of `ansible.git-repositories.view`,
        `ansible.execution-environments.view`, or `ansible.collections.view`,
        plus `catalog.entity.read`.
      tags:
        - Git Content
      security:
        - JWT: []
      parameters:
        - name: scmProvider
          in: query
          required: true
          schema:
            type: string
            enum:
              - github
              - gitlab
          description: Source control provider
        - name: host
          in: query
          required: true
          schema:
            type: string
          description: SCM hostname (e.g. github.com, gitlab.example.com)
        - name: owner
          in: query
          required: true
          schema:
            type: string
          description: Repository owner or organization
        - name: repo
          in: query
          required: true
          schema:
            type: string
          description: Repository name
        - name: filePath
          in: query
          required: true
          schema:
            type: string
          description: Path to the file within the repository (e.g. README.md)
        - name: ref
          in: query
          required: true
          schema:
            type: string
          description: Git reference (branch, tag, or commit SHA)
      responses:
        '200':
          description: File content retrieved successfully
          content:
            text/markdown:
              schema:
                type: string
            application/yaml:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
        '400':
          description: Missing required parameters or unsupported SCM provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: SCM integration authentication failure
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - error
                properties:
                  code:
                    type: string
                    enum:
                      - INTEGRATION_AUTH_FAILED
                    description: Machine-readable error code
                  error:
                    type: string
                additionalProperties: false
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: File not found in the repository
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error fetching file content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ansible/git/ci-activity:
    post:
      operationId: batchCIActivity
      summary: Batch fetch CI/CD activity from GitHub Actions and GitLab Pipelines
      description: |
        Accepts multiple repositories in a single request and returns CI/CD activity
        for each. Supports GitHub Actions workflow runs and GitLab pipeline data.
        **Permissions**: Requires `ansible.git-repositories.view` and `catalog.entity.read`.
      tags:
        - Git Content
      security:
        - JWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required:
                      - key
                      - provider
                    properties:
                      key:
                        type: string
                        description: Unique key to identify this item in the response
                      provider:
                        type: string
                        enum:
                          - github
                          - gitlab
                        description: CI/CD provider
                      host:
                        type: string
                        description: SCM hostname (defaults to github.com or gitlab.com)
                      per_page:
                        type: integer
                        minimum: 1
                        maximum: 100
                        default: 15
                        description: Number of results per repo (max 100)
                      owner:
                        type: string
                        description: Repository owner (required for GitHub)
                      repo:
                        type: string
                        description: Repository name (required for GitHub)
                      projectPath:
                        type: string
                        description: Project path (required for GitLab, e.g. group/project)
      responses:
        '200':
          description: Batch CI activity results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: object
                    additionalProperties:
                      oneOf:
                        - type: object
                          description: Successful result
                          properties:
                            status:
                              type: integer
                            data:
                              description: GitHub workflow_runs object or GitLab pipelines array
                        - type: object
                          description: Error result
                          properties:
                            error:
                              type: string
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /ansible/ee/build:
    post:
      operationId: buildExecutionEnvironment
      summary: Dispatch an execution environment build via GitHub Actions
      description: |
        Triggers the `ee-build.yml` GitHub Actions workflow via workflow_dispatch to build
        an execution environment image. The EE entity is resolved from the catalog to
        determine the repository, ee_dir, and ee_file_name from its annotations.
        **Permissions**: Requires `ansible.execution-environments.view` and `catalog.entity.read`.
        Also accepts external-access service principals (filtered by allowlist).
      tags:
        - Execution Environments
      security:
        - JWT: []
      parameters:
        - name: X-Github-Token
          in: header
          required: true
          schema:
            type: string
          description: GitHub personal access token with workflow dispatch permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - entityRef
                - customRegistryUrl
                - imageName
                - imageTag
                - verifyTls
              properties:
                entityRef:
                  type: string
                  maxLength: 512
                  description: Backstage entity reference (e.g. resource:default/my-ee)
                owner:
                  type: string
                  maxLength: 256
                  description: GitHub repository owner (optional override; derived from entity annotations when omitted)
                repo:
                  type: string
                  maxLength: 256
                  description: GitHub repository name (optional override; derived from entity annotations when omitted)
                host:
                  type: string
                  maxLength: 256
                  description: GitHub hostname (optional override; derived from entity annotations when omitted)
                customRegistryUrl:
                  type: string
                  maxLength: 1024
                  description: Container registry URL for the built image
                imageName:
                  type: string
                  maxLength: 1024
                  description: Target image name
                imageTag:
                  type: string
                  maxLength: 256
                  description: Image tag for the build
                verifyTls:
                  type: boolean
                  description: Whether to verify TLS when pushing to the registry
                registryType:
                  type: string
                  description: Registry type (optional)
              additionalProperties: false
      responses:
        '202':
          description: Build dispatched successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    enum:
                      - Build started
                  workflow_id:
                    type: integer
                    description: GitHub Actions workflow run ID (when available)
                  workflow_url:
                    type: string
                    description: GitHub Actions workflow run URL (when available)
                additionalProperties: false
        '400':
          description: Invalid request body or missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error during EE build dispatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: GitHub workflow_dispatch call failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /status:
