  # ---- Automation content (automation-content-backend, mounted at /api/automation-content) ----
  # Path strings mirror the router's express-4 patterns verbatim, including the
  # `(*)` wildcard suffix, as required by api/scripts/check-drift.mjs.

  /registries:
    servers:
      - url: /api/automation-content
    get:
      operationId: listRegistries
      tags: [Automation Content Registries]
      security:
        - JWT: []
      summary: List configured registries and their discovered capabilities
      description: |
        Capabilities are probed, not assumed. Use this to understand why a feature is
        unavailable for a given registry — for example, why contents are unknown, or why
        delete is not offered.
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Configured registries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentRegistry' }

  /sync:
    servers:
      - url: /api/automation-content
    post:
      operationId: syncAllRegistries
      tags: [Automation Content Registries]
      security:
        - JWT: []
      summary: Trigger discovery for all configured registries
      description: Deliberate and manual, matching the existing collections pattern, to avoid unbounded syncing.
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Sync result per registry
          content:
            application/json:
              schema:
                type: object
                properties:
                  durationMs: { type: integer }
                  registries:
                    type: array
                    items:
                      type: object
                      properties:
                        registry: { type: string }
                        ok: { type: boolean }
                        discovered: { type: integer }
                        error: { type: string }

  /registries/{name}/poll:
    servers:
      - url: /api/automation-content
    post:
      operationId: pollRegistry
      tags: [Automation Content Registries]
      security:
        - JWT: []
      summary: Poll one registry for changes detected by digest comparison
      description: For registries that cannot push change events; drift is detected by comparing digests.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Poll result
          content:
            application/json:
              schema:
                type: object

  /registries/{name}/sync:
    servers:
      - url: /api/automation-content
    post:
      operationId: syncRegistry
      tags: [Automation Content Registries]
      security:
        - JWT: []
      summary: Trigger discovery for one registry
      description: Deliberate and manual, matching the existing collections pattern, to avoid unbounded syncing.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '202':
          description: Sync started
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  discovered: { type: integer }
        '404':
          description: No such registry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentErrorResponse' }

  /content:
    servers:
      - url: /api/automation-content
    get:
      operationId: listContent
      tags: [Automation Content]
      security:
        - JWT: []
      summary: List content artifacts of any type
      description: |
        Type-agnostic artifact listing. `/execution-environments` and `/collections` are
        thin aliases over this endpoint; they are filters, not separate implementations.
      parameters:
        - name: type
          in: query
          description: 'e.g. `execution-environment`, `collection`, or `oci-image` for unrecognised images.'
          schema: { type: string }
        - name: registry
          in: query
          schema: { type: string }
        - name: collection
          in: query
          description: Only artifacts shipping this collection, e.g. `cisco.ios`.
          schema: { type: string }
        - name: contentsKnown
          in: query
          schema: { type: boolean }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Matching artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionEnvironment' }

  /content/{ref}(*):
    servers:
      - url: /api/automation-content
    get:
      operationId: getContent
      tags: [Automation Content]
      security:
        - JWT: []
      summary: Get one content artifact
      description: The artifact, addressed by its opaque stable ref.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: The artifact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionEnvironment' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentErrorResponse' }

  /content/{ref}(*)/contents:
    servers:
      - url: /api/automation-content
    get:
      operationId: getContentContents
      tags: [Automation Content]
      security:
        - JWT: []
      summary: What is inside an artifact
      description: |
        `depth=direct` returns the artifacts it contains — for an execution environment,
        its collections. `depth=flat` returns the content items themselves. The first is
        how a person browses; the second is how an agent searches.

        When the contents could not be determined, `enumeration.status` is `unknown` and
        both lists are empty. That is not the same as the artifact being empty, and the
        `classification` field explains which situation applies.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: depth
          in: query
          schema:
            type: string
            enum: [direct, flat]
            default: direct
        - name: type
          in: query
          description: Restrict items to one type. Implies `depth=flat`.
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  enumeration: { $ref: '#/components/schemas/Enumeration' }
                  classification: { $ref: '#/components/schemas/Classification' }
                  collections:
                    type: array
                    items: { type: object }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentItemSummary' }

  /execution-environments:
    servers:
      - url: /api/automation-content
    get:
      operationId: listExecutionEnvironments
      tags: [Automation Content Execution Environments]
      security:
        - JWT: []
      summary: List execution environments
      description: Thin alias over `/content?type=execution-environment`.
      parameters:
        - name: registry
          in: query
          schema: { type: string }
        - name: collection
          in: query
          description: Only environments shipping this collection, e.g. `cisco.ios`.
          schema: { type: string }
        - name: contentsKnown
          in: query
          description: Filter by whether the contents could be determined.
          schema: { type: boolean }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Matching environments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ExecutionEnvironment' }

  /execution-environments/{ref}(*):
    servers:
      - url: /api/automation-content
    get:
      operationId: getExecutionEnvironment
      tags: [Automation Content Execution Environments]
      security:
        - JWT: []
      summary: Get one execution environment
      description: Thin alias over `/content/{ref}`.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: The environment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExecutionEnvironment' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentErrorResponse' }

  /execution-environments/{ref}(*)/contents:
    servers:
      - url: /api/automation-content
    get:
      operationId: getExecutionEnvironmentContents
      tags: [Automation Content Execution Environments]
      security:
        - JWT: []
      summary: List everything inside an environment
      description: |
        Returns content items, not artifacts. When contents could not be determined the
        response reports `status: unknown` rather than an empty list.
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
        - name: type
          in: query
          description: Restrict to one item type, e.g. `module`, `filter`, `event_source`.
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Contents
          content:
            application/json:
              schema:
                type: object
                properties:
                  enumeration: { $ref: '#/components/schemas/Enumeration' }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentItemSummary' }

  /collections:
    servers:
      - url: /api/automation-content
    get:
      operationId: listCollections
      tags: [Automation Content Collections]
      security:
        - JWT: []
      summary: List collections available across all registries
      description: Collections discovered inside artifacts, aggregated across registries.
      parameters:
        - name: q
          in: query
          description: Substring match on namespace, name or description.
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Matching collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Collection' }

  /collections/{namespace}/{name}:
    servers:
      - url: /api/automation-content
    get:
      operationId: getCollection
      tags: [Automation Content Collections]
      security:
        - JWT: []
      summary: Get a collection, including which environments provide it
      description: The collection plus the execution environments that ship this version of it.
      parameters:
        - name: namespace
          in: path
          required: true
          schema: { type: string }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: The collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentErrorResponse' }

  /content-items:
    servers:
      - url: /api/automation-content
    get:
      operationId: searchContentItemsTypeAgnostic
      tags: [Automation Content Items]
      security:
        - JWT: []
      summary: Search content items across all artifacts
      description: |
        Type-agnostic content-item search across every artifact. Scope with `in` to a
        specific artifact ref.
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: type
          in: query
          description: 'module, filter, lookup, test, role, playbook, event_source, …'
          schema: { type: string }
        - name: collection
          in: query
          schema: { type: string }
        - name: in
          in: query
          description: Restrict to one artifact, by ref.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Matching items
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalItems: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentItemSummary' }

  /content-items/{fqcn}:
    servers:
      - url: /api/automation-content
    get:
      operationId: getContentItemTypeAgnostic
      tags: [Automation Content Items]
      security:
        - JWT: []
      summary: Full documentation for one content item
      description: |
        Scope with `in` to resolve within a specific artifact. Unscoped, and where the
        name exists in more than one, a `variants` array is returned rather than one
        being chosen — picking silently would produce an answer that looks authoritative
        and may describe a different collection version than the caller will run.
      parameters:
        - name: fqcn
          in: path
          required: true
          schema: { type: string }
        - name: in
          in: query
          description: Artifact ref to resolve within.
          schema: { type: string }
      responses:
        '200':
          description: The item, or its variants
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ContentItem'
                  - type: object
                    properties:
                      fqcn: { type: string }
                      variantCount: { type: integer }
                      variants:
                        type: array
                        items: { $ref: '#/components/schemas/ContentItem' }
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentErrorResponse' }

  /plugins:
    servers:
      - url: /api/automation-content
    get:
      operationId: searchContentItems
      tags: [Automation Content Items]
      security:
        - JWT: []
      summary: Search modules, plugins, roles and EDA plugins
      description: |
        The primary agent-grounding endpoint. Answers "does this environment provide the
        module I am about to generate a task for, and what are its real arguments?"
        without pulling an image.
      parameters:
        - name: q
          in: query
          description: Substring match on fully qualified name or short description.
          schema: { type: string }
        - name: type
          in: query
          description: 'Item type: module, filter, lookup, test, connection, event_source, …'
          schema: { type: string }
        - name: collection
          in: query
          schema: { type: string }
        - name: executionEnvironment
          in: query
          description: Restrict to items available in one environment.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 500 }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Matching items
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalItems: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ContentItemSummary' }

  /plugins/{fqcn}:
    servers:
      - url: /api/automation-content
    get:
      operationId: getContentItem
      tags: [Automation Content Items]
      security:
        - JWT: []
      summary: Full documentation for one content item
      description: |
        Returns the complete argument specification including nested suboptions, plus
        examples and return values where the collection documents them. This is what an
        agent needs to verify generated syntax against the environment that will run it.
      parameters:
        - name: fqcn
          in: path
          required: true
          description: Fully qualified collection name, e.g. `cisco.ios.ios_vlans`.
          schema: { type: string }
        - name: executionEnvironment
          in: query
          description: |
            Resolve within a specific environment. Different environments may ship
            different versions of the same collection, so the documentation differs.
          schema: { type: string }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: The item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
        '404':
          description: Not found in any known environment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentErrorResponse' }

  /resolve/requirements:
    servers:
      - url: /api/automation-content
    post:
      operationId: resolveRequirements
      tags: [Automation Content Resolution]
      security:
        - JWT: []
      summary: Find environments satisfying a set of collection requirements
      description: |
        Accepts the same shape as a Galaxy `requirements.yml`. Use it to answer "which
        execution environment can run this project?" before a job is scheduled, rather
        than discovering a missing collection at runtime.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collections]
              properties:
                collections:
                  type: array
                  items:
                    oneOf:
                      - type: string
                        description: 'Bare name, e.g. `cisco.ios`'
                      - type: object
                        required: [name]
                        properties:
                          name: { type: string }
                          version:
                            type: string
                            description: Exact version, or `*` for any.
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Resolution result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementsResolution' }

  /config/export:
    servers:
      - url: /api/automation-content
    get:
      operationId: exportContentConfig
      tags: [Automation Content Configuration]
      security:
        - JWT: []
      summary: Export the live content configuration as a declarative document
      description: |
        Emits configuration suitable for committing to Git. Secrets are never included;
        credential fields are emitted as environment-variable references so the exported
        document is safe to store in version control.
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, yaml]
            default: json
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: The configuration
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentConfig' }
            application/yaml:
              schema:
                type: string

  /config/validate:
    servers:
      - url: /api/automation-content
    post:
      operationId: validateContentConfig
      tags: [Automation Content Configuration]
      security:
        - JWT: []
      summary: Validate a declarative content configuration without applying it
      description: |
        Intended for CI: validate a proposed change before merge. Reports errors that
        would prevent the configuration loading, and warnings for configurations that
        would load but behave surprisingly — for example a registry with no repositories
        listed and no catalog-enumeration support, which would silently discover nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentConfig' }
      responses:
        '401':
          description: Authentication required
        '403':
          description: Insufficient permissions
        '200':
          description: Validation result. A 200 means the document was understood, not that it is valid — check `valid`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
