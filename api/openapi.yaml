      summary: Get aggregated portal plugin health status
      description: |
        Returns a JSON snapshot of the health state for all registered portal
        plugins. Health is populated by backend plugins via
        `portal-plugin-node`'s `pushHealthStatus()`. Served by
        `@ansible/portal-health-backend`.
      tags:
        - Portal Health
      responses:
