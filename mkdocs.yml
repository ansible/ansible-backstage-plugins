---
# cspell:ignore autohide, autofix
site_name: Ansible Backstage Plugins Documentation
site_url: https://ansible.github.io/projects/ansible-backstage-plugins/
repo_url: https://github.com/ansible/ansible-backstage-plugins
edit_uri: blob/main/docs/
copyright: Copyright © 2025 Red Hat, Inc.
docs_dir: docs
strict: true

# extra_css:
#   - stylesheets/extra.css

theme:
  name: ansible
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.path
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.integrate
extra:
  generator: false
  social:
    - icon: fontawesome/solid/scroll
      link: https://github.com/ansible/ansible-backstage-plugins/releases
      name: Releases
    - icon: simple/mastodon
      link: https://fosstodon.org/@ansible
      name: Mastodon
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/ansible
      name: Twitter
    - icon: simple/matrix
      link: https://matrix.to/#/#devtools:ansible.com
      name: Matrix
    - icon: fontawesome/brands/discourse
      link: https://forum.ansible.com/c/project/7
      name: Ansible forum
    - icon: fontawesome/brands/github-alt
      link: https://github.com/ansible/ansible-backstage-plugins
      name: GitHub

nav:
  - Home:
      - home: index.md
  - Setup:
      - installation.md
  - Plugins:
      - Portal core and SDK:
          - portal-core: plugins/portal-core.md
          - portal-extension-api: plugins/portal-extension-api.md
          - portal-extension-common: plugins/portal-extension-common.md
          - portal-extension-host: plugins/portal-extension-host.md
          - portal-health-backend: plugins/portal-health-backend.md
          - portal-operations-backend: plugins/portal-operations-backend.md
          - portal-plugin-node: plugins/portal-plugin-node.md
          - portal-plugin-sdk: plugins/portal-plugin-sdk.md
      - AAP:
          - auth-backend-module-rhaap-provider: plugins/auth.md
          - backstage-rhaap: plugins/backstage-frontend.md
          - backstage-rhaap-common: plugins/backstage-rhaap-common.md
          - catalog-backend-module-rhaap: plugins/catalog.md
          - catalog-backend-module-rhaap-user-provisioner: plugins/catalog-user-provisioner.md
          - scaffolder-backend-module-backstage-rhaap: plugins/scaffolder.md
      - APME:
          - backstage-apme: plugins/backstage-apme.md
          - backstage-apme-common: plugins/backstage-apme-common.md
          - catalog-backend-module-apme: plugins/catalog-apme.md
          - scaffolder-backend-module-apme: plugins/scaffolder-apme.md
      - Self-service:
          - portal-scaffolder: plugins/self-service.md
  - Portal SDK:
      - SDK architecture: next/portal-sdk-architecture.md
      - Third-party plugin authors: next/portal-sdk-plugin-author-guide.md
      - Native NFS composition: next/portal-sdk-nfs-composition.md
      - Implementation guide: next/portal-plugin-factory-implementation-guide.md
      - Content picker proposal: next/portal-content-picker-contract-proposal.md
      - Design tokens: next/portal-sdk-design-tokens.md
      - Quickstart (legacy compatibility): next/portal-sdk-quickstart.md
      - Dynamic plugins (legacy notes): next/portal-sdk-rhdh-dynamic-plugin.md
  - Architecture:
      - Historical architecture and planning:
          - Content experience refactoring plan: architecture/content-experience-refactor-and-sdk.md
          - Historical self-service extensions: architecture/self-service-extension-sdk.md
      - Diagrams:
          - Overview: diagrams/README.md
          - Structure: diagrams/architecture/README.md
          - Runtime sequences: diagrams/sequence/README.md
  - Features:
      - features/external-authentication.md
      - features/users-teams-organizations.md
      - features/job-templates.md
      - features/home-template-listing.md
      - features/feedback-configuration.md

  - Architecture decisions:
      - adrs/index.md
      - Common:
          - adrs/common/index.md
          - adrs/common/010-plugin-factory-composability.md
          - adrs/common/011-plugin-factory-config-namespace.md
          - adrs/common/012-plugin-factory-preview-labeling.md
          - adrs/common/013-plugin-factory-enablement-defaults.md
          - adrs/common/015-plugin-factory-catalog-first-surfaces.md
          - adrs/common/016-plugin-factory-template-vs-plugin.md
          - adrs/common/017-plugin-factory-preview-chip-placement.md
          - adrs/common/018-plugin-factory-shared-ui-primitives.md
          - adrs/common/019-plugin-factory-delivery-lifecycle.md
          - adrs/common/020-multi-org-namespace-isolation.md
          - adrs/common/022-multi-org-rbac-and-auth.md
          - adrs/common/026-multi-org-architecture-overview.md
          - adrs/common/027-catalog-entity-naming-and-namespaces.md
      - Third-party:
          - adrs/third-party/index.md
          - adrs/third-party/028-out-of-tree-plugin-obligations.md
      - Host:
          - adrs/host/index.md
          - adrs/host/001-config-storage-and-precedence.md
          - adrs/host/002-config-boundary-rule.md
          - adrs/host/003-admin-experience-wizard-and-settings.md
          - adrs/host/004-auth-and-restart-lifecycle.md
          - adrs/host/005-deployment-architecture.md
          - adrs/host/006-sdlc-document-structure.md
          - adrs/host/007-agent-skills-location.md
          - adrs/host/021-template-type-taxonomy.md
          - adrs/host/023-per-template-rbac-filtering.md
          - adrs/host/024-sync-ux-backstage-signals.md

exclude_docs: |
  _autofix_rules.md

plugins:
  - autorefs
  - macros:
      modules: [mkdocs-ansible:mkdocs_ansible]
  - markdown-exec
  - material/search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - material/social
  - material/tags
  # https://github.com/manuzhang/mkdocs-htmlproofer-plugin
  # - htmlproofer

markdown_extensions:
  - markdown_include.include:
      base_path: docs
  - admonition
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.magiclink:
      repo_url_shortener: true
      repo_url_shorthand: true
      social_url_shorthand: true
      social_url_shortener: true
      user: facelessuser
      repo: pymdown-extensions
      normalize_issue_symbols: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      check_paths: true
  - toc:
      toc_depth: 2
      permalink: true
